# /etc/fail2ban/filter.d/nginx-sensitive-files.conf
#
# Сводный фильтр nginx для jail [nginx-sensitive-files].
# Покрывает все типы атак на чувствительные эндпоинты в одном месте:
#
#   1) HTTP Flood (GET / HEAD)            — массовый GET/HEAD-обстрел.
#   2) POST Flood                          — POST-обстрел /auth/*, /api/*, /remote-proxy/*.
#   3) Slowloris                           — обрезанные соединения 408/444/499
#                                            и сообщения nginx error.log про timeout/закрытие.
#   4) Bad request                         — 400/405/413/414/416/431/494..497.
#   5) Noscript / sensitive paths          — обращения к /admin, /.env, /wp-login,
#                                            *.php, *.asp, *.git, /vendor/, /actuator/env и т.д.
#   6) Badbots                             — известные сканеры/боты по User-Agent
#                                            и автоматизированные клиенты (python-requests,
#                                            curl, wget, aiohttp, masscan, nikto, sqlmap…).
#
# Ожидаемый формат логов nginx — combined (см. nginx-sample.conf):
#   <ip> - <user> [<time>] "<METHOD> /path HTTP/x.y" <code> <size> "<ref>" "<ua>"

[INCLUDES]
before = common.conf

[Definition]

# Известные «плохие» User-Agent (бот-фермы, сканеры, эксплоит-кит-фреймворки).
badbots = atSpider|BackDoorBot|BackWeb|Bandit|BatchFTP|Bigfoot|Black\.Hole|BlackWidow|BlowFish|BotALot|Buddy|BuiltBotTough|Bullseye|BunnySlippers|Cegbfeieh|CheeseBot|CherryPicker|ChinaClaw|CopyRightCheck|cosmos|Crescent|Custo|DA|DIIbot|DISCo|DittoSpyder|Download\sDemon|Download\sDevil|Download\sWonder|dragonfly|Drip|eCatch|EasyDL|ebingbong|EirGrabber|EmailCollector|EmailSiphon|EmailWolf|EroCrawler|Exabot|Express\sWebPictures|Extractor|EyeNetIE|FlashGet|Foobot|FrontPage|GetRight|GetWeb!|Go-Ahead-Got-It|Go!Zilla|Grafula|Harvest|hloader|HMView|HTTrack|humanlinks|ia_archiver|Image\sStripper|Image\sSucker|InterGET|Internet\sNinja|InternetSeer|Iria|Jakarta|Java|JennyBot|JetCar|JOC|JustView|Jyxobot|Kenjin\sSpider|Keyword\sDensity|larbin|LeechFTP|LexiBot|libWeb|libwww|LinkextractorPro|LinkScan|LinkWalker|LNSpiderguy|lwp-trivial|Magnet|Mag-Net|MarkWatch|Mass\sDownloader|Mata\sHari|Microsoft\sURL\sControl|MIDown\stool|MIIxpc|Mister\sPiX|moget|Mozilla/3\.Mozilla/2\.01|Mr\.\sPiX|MSFrontPage|MSIECrawler|NAMEPROTECT|Navroad|NearSite|NetAnts|Netcraft|NetMechanic|NetSpider|Net\sVampire|NetZIP|NICErsPRO|Ninja|NPbot|Octopus|Offline\sExplorer|Offline\sNavigator|Openfind|Pavuk|PHP\sversion|PingALink|ProPowerBot|prospector|ProWebWalker|psbot|Pump|QueryN|RealDownload|Reaper|Recorder|ReGet|RepoMonkey|RMA|sitecheck|Siphon|SiteSnagger|SlySearch|SmartDownload|Snake|Snapbot|Snoopy|sogou|SpaceBison|SpankBot|spanner|Sqworm|Stripper|Sucker|SuperBot|SuperHTTP|Surfbot|suzuran|Szukacz|tAkeOut|Teleport|Telesoft|TheNomad|TightTwatBot|Titan|toCrawl|toolpak|traffixer|True_Robot|turingos|TurnitinBot|URLy\sWarning|Vacuum|VCI|VoidEYE|WebAuto|WebBandit|WebCopier|WebEMailExtrac|WebEnhancer|WebFetch|WebGo\sIS|Web\sImage\sCollector|Web\sSauger|Webster|WebStripper|WebWhacker|WebZIP|Wget|Widow|WWW-Collector-E|WWWOFFLE|WebReaper|WebSauger|WebStripper|Xaldon|Xenu|Zeus|ZmEu|nikto|sqlmap|fimap|w3af|whatweb|libcurl|masscan|zgrab|Hakrawler|Nmap|gobuster|wfuzz|nuclei

# Подозрительные пути / расширения (noscript). Любое попадание учитывается.
noscript_paths = (?:\.(?:php|asp|aspx|jsp|cgi|cfm|env|git|sql|bak|old|tar|zip|gz)(?:[?\s]|$)|/(?:wp-(?:admin|login|content|includes)|phpmyadmin|pma|adminer|mysql|webdav|owa|autodiscover|\.git/|\.env|\.aws|\.ssh|vendor/|administrator/|cgi-bin/|manager/html|wls-wsat|hudson|jenkins/login|solr/|actuator/env|console))

failregex = ^<HOST>\s-\s.*?\s"(?:GET|HEAD)\s[^"]+"\s(?:200|206|301|302|304|400|403|404|405)\s
            ^<HOST>\s-\s.*?\s"POST\s/(?:auth|api|remote-proxy)/[^"]*"\s\d{3}\s
            ^<HOST>\s-\s.*?\s"[^"]*"\s(?:408|444|499)\s
            ^\s*\S+\s\[error\].*?,\sclient:\s<HOST>,.*?(?:client\stimed\sout|client\sprematurely\sclosed\sconnection|upstream\stimed\sout|upstream\sprematurely\sclosed\sconnection)
            ^<HOST>\s-\s.*?\s"(?:[A-Z]+|-)\s[^"]*"\s(?:400|405|413|414|416|431|494|495|496|497)\s
            ^<HOST>\s-\s.*?\s"(?:GET|POST|HEAD)\s[^"]*?%(noscript_paths)s[^"]*"\s\d{3}
            ^<HOST>\s-\s.*?\s"[A-Z]+\s[^"]*"\s\d{3}\s\d+\s"[^"]*"\s"[^"]*(?:%(badbots)s)[^"]*"
            ^<HOST>\s-\s.*?\s"[A-Z]+\s[^"]*"\s\d{3}\s\d+\s"[^"]*"\s"(?:python-requests|aiohttp|curl|wget|httpx|Go-http-client)/[^"]*"

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
