# /etc/fail2ban/filter.d/sshd.conf
#
# Сводный фильтр SSH для jail [sshd]. Перекрывает встроенный sshd-filter
# fail2ban, агрегируя в одном месте все типичные паттерны атак на sshd:
#
#   1) Failed password / wrong password         — обычный брутфорс.
#   2) Invalid user                             — перебор имён пользователей.
#   3) Failed publickey                         — попытки с чужими ключами.
#   4) Pre-auth disconnect / banner exchange    — массовое сканирование sshd.
#   5) Too many authentication failures         — много попыток в одной сессии.
#   6) Bad protocol / bad version               — кривые клиенты/сканеры.
#   7) maximum authentication attempts exceeded — упор в MaxAuthTries.
#   8) refused connect from / not allowed       — DenyUsers / AllowUsers фильтр.
#   9) reverse mapping checking getaddrinfo     — попытки спуфа.
#  10) Connection closed/reset by authenticating user — обрыв при auth.
#
# Ожидаемый источник логов:
#   /var/log/auth.log (Debian/Ubuntu) или
#   /var/log/secure   (RHEL/CentOS/Rocky/Alma) или
#   journald  (через backend = systemd в jail.local).

[INCLUDES]
before = common.conf

[Definition]

_daemon = sshd

# Префикс одной строки лога: timestamp, hostname, sshd[pid]:
__pref = (?:%(__prefix_line)s)?(?:[A-Z][a-z]{2}\s+\d{1,2}\s\d{2}:\d{2}:\d{2}\s+\S+\s+)?sshd(?:\[\d+\])?:\s*

failregex = ^%(__pref)s(?:Failed|Invalid|error:\s*PAM:\s*Authentication\s*failure|error:\s*maximum\s*authentication\s*attempts\s*exceeded).*?\sfor\s(?:invalid\suser\s)?\S+\sfrom\s<HOST>(?:\s|$)
            ^%(__pref)sFailed\s\S+\sfor\s(?:invalid\suser\s)?\S+\sfrom\s<HOST>\sport\s\d+\s\S+\s*$
            ^%(__pref)sInvalid\suser\s.*?\sfrom\s<HOST>(?:\sport\s\d+)?\s*$
            ^%(__pref)sUser\s\S+\s+from\s<HOST>\s+not\sallowed\sbecause\s.*$
            ^%(__pref)sROOT\sLOGIN\sREFUSED.*\sFROM\s<HOST>\s*$
            ^%(__pref)sreverse\smapping\schecking\sgetaddrinfo\sfor\s.*?\[<HOST>\]\sfailed.*$
            ^%(__pref)sAddress\s<HOST>\s.*?POSSIBLE\sBREAK-IN\sATTEMPT.*$
            ^%(__pref)srefused\sconnect\sfrom\s\S+\s\(<HOST>\)\s*$
            ^%(__pref)s(?:error|fatal):\s*Received\sdisconnect\sfrom\s<HOST>(?:\sport\s\d+)?:\s*\d+:\s*.*\[preauth\]\s*$
            ^%(__pref)sDisconnected\sfrom\s(?:invalid|authenticating)\suser\s\S+\s<HOST>(?:\sport\s\d+)?\s*\[preauth\]\s*$
            ^%(__pref)sDisconnecting\s(?:invalid|authenticating)\suser\s\S+\s<HOST>(?:\sport\s\d+)?:.*\[preauth\]\s*$
            ^%(__pref)sConnection\s(?:closed|reset)\sby\s(?:invalid|authenticating)\suser\s\S+\s<HOST>(?:\sport\s\d+)?\s*\[preauth\]\s*$
            ^%(__pref)sConnection\sfrom\s<HOST>\sport\s\d+.*?:\s*Bad\sprotocol\sversion\sidentification\s.*$
            ^%(__pref)sbanner\sexchange:\sConnection\sfrom\s<HOST>(?:\sport\s\d+)?:\s*invalid\sformat\s*$
            ^%(__pref)serror:\s*kex_exchange_identification:\s*(?:Connection\sclosed\sby\s|read:\s*Connection\sreset\sby\s)?(?:remote\shost\s)?<HOST>.*$
            ^%(__pref)serror:\s*maximum\s*authentication\s*attempts\s*exceeded\sfor\s.*?\sfrom\s<HOST>(?:\sport\s\d+)?.*$
            ^%(__pref)sFailed\spassword\sfor\sroot\sfrom\s<HOST>\sport\s\d+\sssh\d?\s*$

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              {^LN-BEG}(?:%%a\s+)?%%b\s+%%d\s+%%H:%%M:%%S
              {^LN-BEG}
