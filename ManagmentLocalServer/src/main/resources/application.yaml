server:
  port: ${SERVER_PORT:3001}

spring:
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/local_database.db}
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: true
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: false

# CORS configuration
mvc:
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:3600000}

# Remote server configuration
remote:
  server:
    url: ${REMOTE_SERVER_URL:http://localhost:8080}
    enabled: ${REMOTE_SYNC_ENABLED:true}
    timeout: ${REMOTE_TIMEOUT:30000}

# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# File Upload Configuration
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 55MB

# File Storage Configuration
file:
  storage:
    path: ./data/files

# Device security policy (antivirus check on login/setup)
security:
  device:
    enforce: ${SECURITY_DEVICE_ENFORCE:true}
    require-realtime: ${SECURITY_DEVICE_REQUIRE_REALTIME:true}
    require-up-to-date: ${SECURITY_DEVICE_REQUIRE_UP_TO_DATE:false}
    max-snapshot-age-seconds: ${SECURITY_DEVICE_MAX_SNAPSHOT_AGE:120}
    allow-stub-providers: ${SECURITY_DEVICE_ALLOW_STUB:true}

---
# Docker profile configuration
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlite:/app/data/local_database.db

# File storage path for Docker
file:
  storage:
    path: /app/data/files 