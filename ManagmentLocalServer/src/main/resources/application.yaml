server:
  port: 3001

spring:
  datasource:
    url: jdbc:sqlite:./data/local_database.db
    driver-class-name: org.sqlite.JDBC
    
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        hbm2ddl:
          auto: update
        globally_quoted_identifiers: true
    show-sql: true

  flyway:
    enabled: false

# CORS configuration
mvc:
  cors:
    allowed-origins: "*"
    allowed-methods: "*"
    allowed-headers: "*"
    allow-credentials: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:local-server-secret-key-which-should-be-at-least-256-bits-long-for-security-purposes}
  expiration: ${JWT_EXPIRATION:3600000}

# Remote server configuration
remote:
  server:
    url: ${REMOTE_SERVER_URL:http://localhost:8080}
    enabled: ${REMOTE_SYNC_ENABLED:true}
    timeout: ${REMOTE_TIMEOUT:30000}

# Swagger Configuration
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Actuator for health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# File Upload Configuration
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 55MB

# File Storage Configuration
file:
  storage:
    path: ./data/files

---
# Docker profile configuration
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:sqlite:/app/data/local_database.db

# File storage path for Docker
file:
  storage:
    path: /app/data/files 