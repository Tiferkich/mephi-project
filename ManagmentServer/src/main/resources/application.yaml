server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/vaultdb
    username: vaultuser
    password: vaultpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ✅ Email Configuration для Gmail
mail:
  host: smtp.gmail.com
  port: 587
  username: jackdaniels.trener@gmail.com               # Можно оставить пустым для тестирования
  password: oyyxfhxgtfzclolt               # Можно оставить пустым для тестирования
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-very-long-secret-key-which-should-be-at-least-256-bits-long-for-security}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds (increased for dev)

# ✅ НОВОЕ: Application Configuration
app:
  name: Password Manager
  mail:
    from: jackdaniels.trener@gmail.com     # ← Замените на свой email

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    displayRequestDuration: true
    filter: true
    showExtensions: true
    showCommonExtensions: true
    tryItOutEnabled: true
  show-actuator: false
  group-configs:
    - group: 'management-server-api'
      display-name: 'Management Server API'
      paths-to-match: '/api/**'

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# VirusTotal API Configuration (для проверки файлов на вирусы)
virustotal:
  api-key: ${VIRUSTOTAL_API_KEY:}  # Получить на https://www.virustotal.com/gui/join-us
  api-url: https://www.virustotal.com/api/v3
  enabled: ${VIRUSTOTAL_ENABLED:true}
  polling-interval: 30000  # 30 секунд между проверками статуса

# File Upload Configuration
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 55MB