server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vaultdb}
    username: ${DB_USERNAME:vaultuser}
    password: ${DB_PASSWORD:vaultpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Email Configuration
spring.mail:
  host: ${MAIL_HOST:smtp.gmail.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
        connectiontimeout: 5000
        timeout: 3000
        writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# Application Configuration
app:
  name: ${APP_NAME:Password Manager}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}

# Swagger Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    docExpansion: none
    defaultModelsExpandDepth: 2
    defaultModelExpandDepth: 2
    displayRequestDuration: true
    filter: true
    showExtensions: true
    showCommonExtensions: true
    tryItOutEnabled: true
  show-actuator: false
  group-configs:
    - group: 'management-server-api'
      display-name: 'Management Server API'
      paths-to-match: '/api/**'

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# VirusTotal API Configuration
virustotal:
  api-key: ${VIRUSTOTAL_API_KEY:}
  api-url: ${VIRUSTOTAL_API_URL:https://www.virustotal.com/api/v3}
  enabled: ${VIRUSTOTAL_ENABLED:true}
  polling-interval: ${VIRUSTOTAL_POLLING_INTERVAL:30000}

# File Upload Configuration
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 55MB

# Scheduled backups to S3-compatible store (e.g. MinIO)
backup:
  s3:
    enabled: ${BACKUP_S3_ENABLED:false}
    endpoint: ${BACKUP_S3_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${BACKUP_S3_ACCESS_KEY:}
    secret-key: ${BACKUP_S3_SECRET_KEY:}
    bucket: ${BACKUP_S3_BUCKET:vault-backups}
    schedule: ${BACKUP_S3_CRON:0 0 3 * * *}
    retention-days: ${BACKUP_S3_RETENTION_DAYS:30}
    region: ${BACKUP_S3_REGION:us-east-1}